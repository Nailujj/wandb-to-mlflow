[project]
name = "wandb-to-mlflow"
dynamic = ["version"]
description = "Migrate Weights & Biases runs into any MLflow tracking server."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Julian" }]
keywords = ["wandb", "mlflow", "migration", "experiment-tracking", "weights-and-biases"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Every floor here is *tested*, not guessed: CI's `floors` job installs exactly
# these minima and runs the full offline suite against them. Raise a floor and
# that job is the thing that must stay green.
#
# - mlflow 2.22 is the oldest that imports in a bare venv. 2.9-2.21 import
#   `pkg_resources`, which modern setuptools no longer ships, so the old
#   ">=2.9" floor could not even be imported at its own minimum.
# - wandb 0.17.3 is the oldest that survives numpy 2 (0.17.2 and earlier use
#   `np.float_`, removed in numpy 2.0, and mlflow pulls numpy 2 in).
# - typer 0.15.4 is the oldest that resolves against a click it actually works
#   with; 0.12.x declares no click bound and breaks option parsing under
#   click >= 8.2.
dependencies = [
    "wandb>=0.17.3",
    "mlflow>=2.22",
    "typer>=0.15.4",
    "tenacity>=8.2.3",
]

[project.urls]
Repository = "https://github.com/Nailujj/wandb-to-mlflow"
Issues = "https://github.com/Nailujj/wandb-to-mlflow/issues"
Changelog = "https://github.com/Nailujj/wandb-to-mlflow/blob/main/CHANGELOG.md"

[project.scripts]
wandb-to-mlflow = "wandb_to_mlflow.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wandb_to_mlflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wandb_to_mlflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
# No python_version pin: it must match the interpreter mypy runs under, otherwise
# third-party stubs compiled for a newer syntax (numpy) fail to parse. See DECISIONS.md.
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["wandb.*", "mlflow.*", "tenacity.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires real W&B and MLflow services (opt-in)"]
addopts = "-m 'not e2e'"

[tool.coverage.run]
branch = true
source = ["wandb_to_mlflow"]
